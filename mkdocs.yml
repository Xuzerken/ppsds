site_name: ppsds
site_description: >-
  Probabilistic prediction for stochastic dynamical systems
site_url: https://xuzerken.github.io/ppsds/
repo_url: https://github.com/Xuzerken/ppsds
repo_name: Xuzerken/ppsds
edit_uri: edit/main/docs/
copyright: MIT licensed &middot; Tao Xu and Jianping He

theme:
  name: material
  features:
    # `navigation.sections` is deliberately NOT enabled: it flattens top-level sections into
    # non-collapsible headers with un-indented children. The default gives a collapsible group
    # with indented children, which is what a two-page section wants.
    #
    # `navigation.indexes` makes a section's first entry (`examples/index.md`, ...) its landing
    # page: the section title links there and a separate chevron expands the group, instead of a
    # duplicate "Examples" child under the "Examples" section.
    - navigation.indexes
    - navigation.top
    # Previous/next links at the foot of every page. The nav order is the recommended route, so
    # these turn the shelf order into "keep going" -- the reader who finishes a page is offered the
    # one we would have recommended next rather than being dropped back into the sidebar.
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to the light theme

# Three small files of our own, loaded by every page: the header buttons that fold the navigation
# column and the table of contents (`docs/assets/sidebars.{js,css}`), and the rules that give the
# front page's three cards equal columns (`docs/assets/cards.css`). Material has no desktop toggle
# for either column, and the Play page's game is in an iframe whose width is what those two columns
# leave behind -- so folding them is worth two buttons. Written here rather than pulled from the
# plugin ecosystem, which would put a third-party package inside the docs build of a published
# package; `--strict` fails the build if any of them goes missing.
#
# Note that `tests/test_public_face.py` takes the files named here as "loaded without being
# referenced by a page": a stylesheet is pulled in by this list, not by a link in the markdown.
extra_css:
  - assets/sidebars.css
  - assets/cards.css
extra_javascript:
  - assets/sidebars.js
  - assets/mathjax.js
  # MathJax itself comes from the CDN: it is the one runtime a page needs that cannot be
  # vendored into the site, and the config above tells it to process only arithmatex spans.
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# The order is the route a reader is most likely to take, not the order the code was written in.
# Four kinds of node share the shelf: Examples (stories you can run), Experiments (the same
# questions at paper scale), Research (the papers and their preliminaries), and Tutorials (topics
# treated on their own terms). `tutorials/map.md` draws the graph for readers who would rather
# navigate themselves than follow the shelf order.
nav:
  - Home: index.md
  - Examples:
      - examples/index.md
      - Play: examples/understand_ppsds_by_pmf_betting/index.md
      - Put it on your own system: examples/apply_drpp_to_your_own_env/index.md
      - What "worst case" means: examples/understand_drpp_on_simulated_ambiguity/index.md
      - The ceiling: examples/understand_predictability/index.md
  - Experiments:
      - experiments/index.md
      - DRPP on simulated ambiguity: experiments/drpp.md
      - The betting experiment: experiments/pmf_betting.md
      - The predictability experiment: experiments/predictability.md
  - Research:
      - research/index.md
      - Preliminaries: research/preliminaries.md
      - Probabilistic predictability paper: research/probabilistic-predictability.md
      - Conic DRPP paper: research/drpp-conic.md
  - Tutorials:
      - tutorials/index.md
      - Getting started: tutorials/getting-started.md
      - A new family and its DRPP: tutorials/developer-guide.md
      - Troubleshooting: tutorials/troubleshooting.md
      - The map: tutorials/map.md
  - Contributing:
      - contributing/index.md
      - Reporting a problem: contributing/reporting.md
      - Pull requests: contributing/pull-requests.md
      - Research collaborations: contributing/research.md
  - API: api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # The API reference is generated from the docstrings, which are the authoritative description
  # of the design -- so this page cannot drift from the code.
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            # Manual section headings are H2, so module headings start one level below them.
            # Without this, `Predictors` and its module `conic_moment` share a level and the
            # right-hand TOC cannot show the nesting.
            heading_level: 3
            show_source: false
            show_root_heading: true
            show_root_full_path: false      # the module path already carries the meaning
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            filters: ["!^_"]

# Building with `--strict` makes any warning fatal, which is what turns this into a gate: a
# broken relative link or a nav entry pointing at a missing page fails the build rather than
# shipping a site with a hole in it.
strict: true
