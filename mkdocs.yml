site_name: ppsds
site_description: >-
  Probabilistic prediction for stochastic dynamical systems
site_url: https://xuzerken.github.io/ppsds/
repo_url: https://github.com/Xuzerken/ppsds
repo_name: Xuzerken/ppsds
edit_uri: edit/main/docs/
copyright: MIT licensed &middot; Tao Xu and Jianping He

theme:
  name: material
  features:
    # `navigation.sections` is deliberately NOT enabled: it flattens top-level sections into
    # non-collapsible headers with un-indented children. The default gives a collapsible group
    # with indented children, which is what a two-page section wants.
    - navigation.top
    # Previous/next links at the foot of every page. The nav order is the recommended route, so
    # these turn the shelf order into "keep going" -- the reader who finishes a page is offered the
    # one we would have recommended next rather than being dropped back into the sidebar.
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to the light theme

# Two small files of our own, loaded by every page: the header buttons that fold the navigation
# column and the table of contents (`docs/assets/sidebars.{js,css}`). Material has no desktop
# toggle for either, and the Play page's game is in an iframe whose width is what those two columns
# leave behind -- so folding them is worth two buttons. Written here rather than pulled from the
# plugin ecosystem, which would put a third-party package inside the docs build of a published
# package; `--strict` fails the build if either file goes missing.
extra_css:
  - assets/sidebars.css
extra_javascript:
  - assets/sidebars.js

# The order is the route a reader is most likely to take, not the order the code was written in:
# play first (no install, thirty seconds), then the rigorous version of the same thing, then the
# concepts, then the path where you have an environment of your own. `map.md` draws the graph for
# readers who would rather navigate themselves than follow the shelf order.
nav:
  - Home: index.md
  - The betting game:
      - Play it: understand_ppsds_by_pmf_betting/index.md
      - …then measure it properly: understand_ppsds_by_pmf_betting/experiment.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Predictability: predictability.md
  - Examples: examples.md
  - Map: map.md
  - Developer Guide:
      - Writing a new family: extending.md
      - Troubleshooting: extending-faq.md
  - API: api.md
  - Citation: citation.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # The API reference is generated from the docstrings, which are the authoritative description
  # of the design -- so this page cannot drift from the code.
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false      # the module path already carries the meaning
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            filters: ["!^_"]

# Building with `--strict` makes any warning fatal, which is what turns this into a gate: a
# broken relative link or a nav entry pointing at a missing page fails the build rather than
# shipping a site with a hole in it.
strict: true
