name: publish

# Publishing, with no long-lived credential anywhere.
#
# PyPI Trusted Publishing exchanges a short-lived OIDC token for a project-scoped upload token,
# so there is no API token in the repository or in secrets -- nothing to leak, and nothing to
# rotate. The one-time setup on the PyPI side (Manage -> Publishing) trusts exactly:
#
#     owner: Xuzerken   repository: ppsds   workflow: publish.yml   environment: pypi
#
# The `pypi` and `testpypi` environments are what make the tag-to-version gate meaningful: bind
# them to a required reviewer in the repository settings and a tag push cannot publish on its
# own.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish this manual run
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # Two questions before anything is uploaded.
  #
  # A version number on PyPI is permanent and can never be reused -- only yanked -- so the tag is
  # compared with `__version__` first: a mismatch would mean either uploading a version nobody
  # intended, or failing after the artifact already exists.
  #
  # The second question exists because this repository's versioning has a private phase. A `0.0.x`
  # version is a beta handed to collaborators through a GitHub Release, and **must not reach
  # PyPI** -- so tagging one builds the artifacts but deliberately skips publishing, rather than
  # spending a permanent version number on something half-finished. The workflow still uploads
  # `dist/` as an artifact, which is exactly what a beta hand-out needs.
  guard:
    name: tag matches __version__, and may be published
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.check.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Compare the tag with the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ppsds/__init__.py)
          if [ -z "$version" ]; then
            echo "could not read __version__ from src/ppsds/__init__.py" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=${tag}  __version__=${version}"
            test "${tag}" = "${version}"
          else
            echo "manual run, __version__=${version} (no tag to compare)"
          fi

          case "$version" in
            0.0.*)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Not publishing to PyPI::ppsds ${version} is a 0.0.x beta. \
          Betas are handed out through a GitHub Release, and a version number on PyPI is \
          permanent, so this run only builds the artifacts -- download them from the run's \
          artifacts to attach to the release."
              ;;
            *)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install build twine
      - run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Manual only, and open to any version: TestPyPI is a sandbox, so rehearsing the upload path
  # with a beta number there costs nothing and is the point of having it.
  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ppsds
    permissions:
      id-token: write          # job level, not workflow level: only this job needs the token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: [build, guard]
    if: >-
      needs.guard.outputs.publishable == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ppsds
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
